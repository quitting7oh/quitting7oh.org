name: Update 7-OH ban status

# Daily re-verification of the ban page and site banner. The script
# checks the Federal Register for 7-hydroxymitragynine documents and
# compares them against the reviewed-document allowlist it carries. If
# everything published has already been folded into the page, it bumps
# the "as of" dates and refreshes the docket's posted-comment count,
# and this workflow commits the result (CF Pages deploys on push).
#
# If an UNREVIEWED document has published (the pending 7-OH threshold
# order, most importantly), the script exits non-zero WITHOUT touching
# the files: the page keeps its last verified date, the run goes red,
# and a human rewrites the page and adds the document number to
# REVIEWED_DOCS. Stale-but-true beats fresh-but-false; never let a cron
# claim "7-OH is not banned" past a document nobody has read.
#
# Re-running:
#   - The Federal Register publishes at 8:45 AM ET, with special
#     filings at 11:15 AM and 4:15 PM ET. A run is scheduled 4
#     minutes after each slot. GitHub's cron is best-effort (starts
#     routinely lag 3-15 min), so real notification latency is
#     roughly 5-20 minutes past publication.
#   - Cron is UTC with no DST awareness, so each slot gets BOTH its
#     EDT and EST anchor (six crons). The wrong-season run of each
#     pair lands an hour off target and hits the script's
#     verification-only no-op; the right-season one lands 4 minutes
#     after the slot. Extra runs cost nothing and can still catch a
#     late-indexed document.
#   - Only the day's first run commits; every later run is pure
#     verification (the script exits before rewriting when the date
#     is already current, and only goes red if something published).
#   - workflow_dispatch lets a maintainer trigger it manually.

on:
  schedule:
    # 8:45 AM ET main publication + 4 min (EDT / EST anchors)
    - cron: '49 12 * * *'
    - cron: '49 13 * * *'
    # 11:15 AM ET special filing + 4 min (EDT / EST anchors)
    - cron: '19 15 * * *'
    - cron: '19 16 * * *'
    # 4:15 PM ET special filing + 4 min (EDT / EST anchors)
    - cron: '19 20 * * *'
    - cron: '19 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ban-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Re-verify and update
        env:
          REGSGOV_API_KEY: ${{ secrets.REGSGOV_API_KEY }}
        run: node scripts/update-ban-status.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes (already updated today) — skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/components/SchedulingBanner.tsx src/content/compounds/7-oh-ban.md
          git commit -m "content(ban): daily status re-verify" \
                     -m "Federal Register checked: no scheduling order. As-of dates bumped; docket count refreshed." \
                     -m "See scripts/update-ban-status.mjs." \
                     -m "Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          # The meeting-data crons push to main too; rebase over
          # anything that landed while this job ran.
          git pull --rebase origin main
          git push
