name: Update 7-OH ban status

# Check published documents and notices on public inspection before
# refreshing dates. New unreviewed filings stop the run without edits;
# a maintainer must update the page and reviewed-document allowlist.
# Pending notices are not scheduling orders. Changes to the October
# notices' expected publication dates also require another review.
#
# Runs follow the main 8:45 AM ET slot (both EDT/EST anchors) and
# check hourly through the US publication day for special filings,
# including irregular ones such as the October 9 noon notices.
# GitHub cron is best-effort; these times are not notification guarantees.
# Only the first run of the day rewrites dates. Later runs still check
# both feeds, so a same-day filing cannot bypass review.

on:
  schedule:
    - cron: '49 12,13 * * *'
    - cron: '19 12-22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ban-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Test ban-status updater against the current page
        run: node --test scripts/test-ban-status.mjs

      - name: Re-verify and update
        env:
          REGSGOV_API_KEY: ${{ secrets.REGSGOV_API_KEY }}
        run: node scripts/update-ban-status.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes (already updated today) — skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/components/SchedulingBanner.astro src/content/compounds/7-oh-ban.md
          git commit -m "content(ban): daily status re-verify" \
                     -m "Published and public-inspection documents checked: all reviewed. As-of dates bumped; docket count refreshed." \
                     -m "See scripts/update-ban-status.mjs." \
                     -m "Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          # The meeting-data crons push to main too; rebase over
          # anything that landed while this job ran.
          git pull --rebase origin main
          git push
